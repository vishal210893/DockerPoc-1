# This file contains two Kubernetes resources:
# 1. A HelmRepository to define the location of the Helm charts
# 2. A HelmRelease to deploy a specific chart version from that repository

# HelmRepository resource defines a Helm repository that Flux will monitor for charts
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  # Name used to reference this repository in other resources
  name: dockerpoc-flux-helm-repository
  # Namespace where this resource will be created
  namespace: default
spec:
  # Interval determines how frequently Flux checks this repository for updates
  interval: 1m0s
  # URL of the Helm repository - this points to a GitHub Pages hosted Helm chart repository
  url: https://vishal210893.github.io/DockerPoc-1

---
# HelmRelease resource defines which chart to deploy from the repository
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Name of this HelmRelease resource
  name: dockerpoc-flux-helm-repository
  # Namespace where this resource and the resulting deployment will live
  namespace: default
spec:
  # Interval determines how frequently Flux reconciles this release
  interval: 1m
  chart:
    spec:
      # Name of the chart to deploy from the repository
      chart: dockerpoc-app
      # Specific version of the chart to deploy
      version: 5.0.1
      # Reference to the source repository containing the chart
      sourceRef:
        # Type of source (HelmRepository in this case)
        kind: HelmRepository
        # Name of the HelmRepository resource defined above
        name: dockerpoc-flux-helm-repository
        # Namespace where the HelmRepository resource is located
        namespace: default
      # How often Flux checks for updates to the chart in the repository
      interval: 30s
  values:
    deployment:
      replicas: 3
